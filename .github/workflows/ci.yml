name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs of the same ref (workflow level, so the matrix jobs
# do not cancel each other).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Bound numerical worker pools on the shared CI runner.
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Lint (Ruff)
        run: ruff check .
      - name: Format check (Black)
        run: black --check .
      - name: Type check (mypy) — the layers the exported script and the CLI rely on
        run: mypy src/easy_glm/core src/easy_glm/workflow --ignore-missing-imports
      - name: Run tests
        run: pytest --cov=easy_glm --cov-report=xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml

  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install workbench and browser dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install .[dev]
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Check and build frontend
        working-directory: frontend
        run: |
          npm run check
          npm run build
          node --test tests/*.test.js
          git diff --exit-code -- ../src/easy_glm/desktop/static
      - name: Test modelling, sessions and exports in the browser
        working-directory: frontend
        env:
          EASYGLM_TEST_SOURCE: ${{ github.workspace }}/src
        run: |
          npx playwright test --config playwright.onboarding.config.js
          npx playwright test --config playwright.models.config.js
          npx playwright test --config playwright.interactions.config.js
          npx playwright test --config playwright.exports.config.js
          npx playwright test --config playwright.session.config.js
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-test-results
          path: frontend/test-results/
