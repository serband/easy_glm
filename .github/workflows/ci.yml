name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs of the same ref (workflow level, so the matrix jobs
# do not cancel each other).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Bound numerical worker pools on the shared CI runner.
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint (Ruff)
        run: ruff check .
      - name: Format check (Black)
        run: black --check .
      - name: Type check (mypy) — the layers the exported script and the CLI rely on
        run: mypy src/easy_glm/core src/easy_glm/workflow src/easy_glm/pricing --ignore-missing-imports
      - name: Run tests
        run: pytest --cov=easy_glm --cov-report=xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml

  windows-wheel:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build candidate wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - name: Install wheel and focused test runtime
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist\*.whl).FullName
          python -m pip install $wheel pytest "httpx>=0.27,<1"
          python -m pip check
      - name: Verify installed package and bundled workbench
        shell: pwsh
        run: >
          python -c "from pathlib import Path; import easy_glm;
          import easy_glm.desktop.fit_progress; import easy_glm.pricing;
          package = Path(easy_glm.__file__).resolve().parent;
          assert 'site-packages' in [part.lower() for part in package.parts], package;
          assert not package.is_relative_to(Path.cwd().resolve() / 'src'), package;
          static = package / 'desktop' / 'static';
          assert (static / 'index.html').is_file(), static;
          assert any((static / 'assets').iterdir()), static"
      - name: Run focused Windows subprocess and workbench tests
        shell: pwsh
        run: |
          Rename-Item src source-tree-disabled
          python -m pytest -q --maxfail=1 `
            tests/test_desktop_fit_progress.py `
            tests/test_desktop_models.py `
            tests/test_desktop_refit.py `
            tests/test_desktop_pairs.py `
            tests/test_desktop_feature_selection.py `
            tests/test_desktop_launcher.py

  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install workbench and browser dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install ".[dev]"
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Check and build frontend
        working-directory: frontend
        run: |
          npm run check
          npm run build
          node --test tests/*.test.js
          git diff --exit-code -- ../src/easy_glm/desktop/static
      - name: Test modelling, sessions and exports in the browser
        working-directory: frontend
        env:
          EASYGLM_TEST_SOURCE: ${{ github.workspace }}/src
        run: |
          npx playwright test --config playwright.onboarding.config.js
          npx playwright test --config playwright.config.js
          npx playwright test --config playwright.screening.config.js
          npx playwright test --config playwright.explore.config.js
          npx playwright test --config playwright.models.config.js
          npx playwright test --config playwright.interactions.config.js
          npx playwright test --config playwright.pair-editor.config.js
          npx playwright test --config playwright.pair-fit.config.js
          npx playwright test --config playwright.exports.config.js
          npx playwright test --config playwright.session.config.js
          npx playwright test --config playwright.split.config.js
          npx playwright test --config playwright.binning.config.js
          npx playwright test --config playwright.feature-selection.config.js
          npx playwright test --config playwright.importance.config.js
          npx playwright test --config playwright.reuse.config.js
          npx playwright test --config playwright.time.config.js
          npx playwright test --config playwright.reduction.config.js
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-test-results
          path: frontend/test-results/
