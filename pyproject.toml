[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy_glm"
version = "0.3.0"
description = "Automate insurance pricing with LASSO-regularised GLMs – blueprint generation, preprocessing, model fitting, rate table extraction & plotting. Built on glum."
readme = "README.md"
authors = [
    {name = "Serban Dragne", email = "sadragne@gmail.com"}
]
license = "MIT"
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "polars>=1.17.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "glum>=3.0.0",
    "pandas>=2.0.0",
    "rdata>=0.9.0",        # load_external_dataframe (French motor .rda), imported lazily
    "joblib>=1.0.0",       # EasyGLM.save / load
    "xlsxwriter>=3.0.0",   # Excel rate-table export
]


[project.scripts]
easy-glm-workbench = "easy_glm.app.__main__:main"

[project.urls]
Homepage = "https://github.com/serband/easy_glm"
Repository = "https://github.com/serband/easy_glm"
Issues = "https://github.com/serband/easy_glm/issues"

[project.optional-dependencies]
dev = [
    "streamlit>=1.45.0",   # workbench + editor tests (AppTest)
    "plotly>=5.15.0",
    "fastexcel>=0.12.0",   # read Excel back in tests (polars engine)
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]
ui = [
    "streamlit>=1.45.0",   # workbench uses st.navigation, badges, width="stretch"
    "plotly>=5.15.0",
]
viz = [
    "matplotlib>=3.7.0",   # plot_all_ratetables
    "seaborn>=0.12.0",
    "plotnine>=0.14.0",
]
benchmark = [
    "statsmodels>=0.14.0",
    "catboost>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["easy_glm*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"
# the dev-environment bootstrap script predates the lint rules
extend-exclude = ["scripts/setup_dev.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages: short module aliases (S = state, C = charts) and plotly's dict() idiom
"src/easy_glm/app/*" = ["N812", "C408"]
